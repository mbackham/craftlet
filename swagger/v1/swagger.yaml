                        type: string
                        nullable: true
                      message:
                        type: string
                      rejected_reason:
                        type: string
                        nullable: true
                      approved_at:
                        type: string
                        nullable: true
                        format: date-time
                      rejected_at:
                        type: string
                        nullable: true
                        format: date-time
                      created_at:
                        type: string
                        nullable: true
                        format: date-time
