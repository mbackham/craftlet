  "/api/v1/payments":
    post:
      summary: 创建支付单
      tags:
      - 支付
      description: |
        为订单创建支付单，返回 App 端调起支付所需的参数（微信/支付宝）。
        - 订单状态必须为 `created`，否则返回 422
        - 只有订单的消费者可以发起支付
        - 支持渠道：`wechat`（微信支付）、`alipay`（支付宝）
        需要 Logto JWT 认证。
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '201':
          description: 支付单创建成功，返回调起参数
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: 支付单 ID
                      channel:
                        type: string
                        enum:
                        - wechat
                        - alipay
                      amount:
                        type: string
                        example: '188.0'
                      status:
                        type: string
                        enum:
                        - pending
                      provider_trade_no:
                        type: string
                        nullable: true
                      pay_params:
                        type: object
                        description: App 调起支付所需参数（微信：prepay_id 等；支付宝：order_string）
                        additionalProperties: true
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: 未登录或 Token 无效
        '403':
          description: 无权为此订单支付
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '422':
          description: 不支持的支付渠道或订单状态不允许支付
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - unsupported_channel
                        - invalid_order_status
                        - payment_create_failed
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  description: 订单 ID
                channel:
                  type: string
                  enum:
                  - wechat
                  - alipay
                  description: 支付渠道
              required:
              - order_id
              - channel
