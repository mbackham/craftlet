                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      message:
                        type: string
  "/api/v1/merchant/apply":
    post:
      summary: 提交商家入驻申请
      tags:
      - 商家
      description: |
        普通用户提交入驻申请，创建 `MerchantProfile`，初始状态为 `submitted`，等待管理员审核。
        - 同一用户只能申请一次（重复提交返回 422）
        - 需要 Logto JWT 认证
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '201':
          description: 申请提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        enum:
                        - submitted
                        example: submitted
                      shop_name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: 未登录或 Token 无效
        '422':
          description: 重复申请或参数验证失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - already_applied
                        - validation_error
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant:
                  type: object
                  properties:
                    shop_name:
                      type: string
                      description: 店铺名称（必填）
                    license_file_key:
                      type: string
                      description: 营业执照 OSS Key
                    idcard_front_key:
                      type: string
                      description: 身份证正面 OSS Key
                    idcard_back_key:
                      type: string
                      description: 身份证背面 OSS Key
                    bank_name:
                      type: string
                      description: 开户银行名称
                    bank_branch:
                      type: string
                      description: 开户支行
                    address_province:
                      type: string
                      description: 省份
                    address_city:
                      type: string
                      description: 城市
                    address_district:
                      type: string
                      description: 区县
                    address_detail:
                      type: string
                      description: 详细地址
                  required:
                  - shop_name
              required:
              - merchant
