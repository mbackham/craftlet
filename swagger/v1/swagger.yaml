---
openapi: 3.0.1
info:
  title: Craftlet API
  version: v1
  description: Craftlet 平台 API 接口文档
  contact:
    name: Craftlet Team
paths:
  "/api/payments/callbacks/wechat":
    post:
      summary: 微信支付回调
      tags:
      - 支付回调
      description: |
        接收微信支付退款结果回调通知。由微信服务器主动 POST 调用，**无需用户 JWT 认证**。

        **请求格式**：JSON Body

        **响应格式**：JSON `{"code": "SUCCESS"}` 或 `{"code": "FAIL"}`（微信要求的格式）

        **幂等性**：重复回调返回 200 SUCCESS，不重复处理。

        ⚠️ **KI-W2-01**：当前签名验证处于 stub 模式（营业执照未到位）。生产前需启用真实 RSA-SHA256 验证。
      parameters: []
      responses:
        '200':
          description: 处理成功（含幂等重复回调）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                    description: 微信要求的成功标识
        '400':
          description: 请求缺少必要字段（如 refund_id）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - FAIL
                  message:
                    type: string
        '422':
          description: 未找到对应退款单（refund_id 不存在）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refund_id:
                  type: string
                  description: 微信退款单号（provider_refund_no）
                out_refund_no:
                  type: string
                  description: 商户退款单号（idempotency_key）
                refund_fee:
                  type: integer
                  description: 退款金额（分）
              required:
              - refund_id
              - out_refund_no
              - refund_fee
  "/api/payments/callbacks/alipay":
    post:
      summary: 支付宝回调
      tags:
      - 支付回调
      description: |
        接收支付宝退款结果回调通知。由支付宝服务器主动 POST 调用，**无需用户 JWT 认证**。

        **请求格式**：Form Data（application/x-www-form-urlencoded）

        **响应格式**：纯文本 `success` 或 `fail`（支付宝要求的格式）

        **幂等性**：重复回调返回 200 success，不重复处理。

        ⚠️ **KI-W2-01**：当前签名验证处于 stub 模式（营业执照未到位）。生产前需启用真实 RSA2 验证。
      parameters: []
      responses:
        '200':
          description: 处理成功，响应体为纯文本 'success'
          content:
            text/plain:
              schema:
                type: string
                example: success
        '400':
          description: 缺少必要字段，响应体为纯文本 'fail'
          content:
            text/plain:
              schema:
                type: string
                example: fail
        '422':
          description: 未找到对应退款单，响应体为纯文本 'fail'
          content:
            text/plain:
              schema:
                type: string
                example: fail
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
        description: 通知类型，如 refund_resultNotify
  "/api/v1/orders/{order_id}/bids":
    get:
      summary: 查看订单竞价列表
      tags:
      - 竞价
      description: |
        返回指定订单的所有报价列表。
        **权限**：只有订单的消费者（customer）可以查看报价列表，商家（bidder）查看会返回 403。
        需要 Logto JWT 认证。
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      - name: order_id
        in: path
        required: true
        description: 订单 ID
        schema:
          type: integer
      responses:
        '200':
          description: 获取成功（仅限订单消费者）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        amount:
                          type: string
                          example: '250.0'
                        status:
                          type: string
                          enum:
                          - pending
                          - accepted
                          - rejected
                        message:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
        '401':
          description: 未登录或 Token 无效
        '403':
          description: 当前用户不是此订单的消费者
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
    post:
      summary: 提交报价
      tags:
      - 竞价
      description: |
        商家对指定订单提交报价（竞价）。报价金额必须大于 0。
        需要 Logto JWT 认证。
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      - name: order_id
        in: path
        required: true
        description: 订单 ID
        schema:
          type: integer
      responses:
        '201':
          description: 报价提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      amount:
                        type: string
                      status:
                        type: string
                        enum:
                        - pending
                      message:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: 未登录或 Token 无效
        '404':
          description: 订单不存在
        '422':
          description: 报价金额无效（≤0）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: 报价金额（必须 > 0）
                  example: '250.00'
                message:
                  type: string
                  description: 报价备注（可选）
              required:
              - amount
  "/api/v1/banners":
    get:
      summary: Banner 列表
      tags:
      - 内容运营
      description: |
        获取当前有效的首页 Banner 列表，按 `position` 升序排列。
        - **无需认证**，App 首页直接调用
        - 支持 `?placement=` 按位置过滤（如 `home_top`、`home_middle`）
        - 支持 `?locale=` 指定语言（默认 `zh-CN`），多语言 title 自动降级
      parameters:
      - name: placement
        in: query
        required: false
        description: Banner 位置筛选，如 home_top / home_middle / splash
        schema:
          type: string
      - name: locale
        in: query
        required: false
        description: 语言代码，如 zh-CN / en，默认 zh-CN
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: 春节特惠活动
                    image_key:
                      type: string
                      example: banners/spring_2026.jpg
                      description: OSS 对象 Key，前端拼接 CDN 域名使用
                    link_url:
                      type: string
                      example: https://craftlet.com/promo/spring
                      description: 点击跳转 URL，可为空
                    position:
                      type: integer
                      example: 1
                      description: 排列顺序，数字越小越靠前
                    placement:
                      type: string
                      example: home_top
                      description: 展示位置
                  required:
                  - id
                  - image_key
                  - position
                  - placement
  "/api/v1/announcements":
    get:
      summary: 公告列表
      tags:
      - 内容运营
      description: |
        获取当前有效的系统公告列表，按置顶+时间倒序排列。
        - **无需认证**，App 公告中心直接调用
        - 支持 `?locale=` 指定语言（默认 `zh-CN`）
        - 置顶公告（`is_pinned: true`）排在最前
      parameters:
      - name: locale
        in: query
        required: false
        description: 语言代码，如 zh-CN / en，默认 zh-CN
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: 平台升级维护通知
                    content:
                      type: string
                      example: 系统将于 2026-05-01 00:00–04:00 进行升级维护…
                    announcement_type:
                      type: string
                      example: system
                      enum:
                      - system
                      - activity
                      - promotion
                    is_pinned:
                      type: boolean
                      example: true
                    created_at:
                      type: string
                      format: date-time
                  required:
                  - id
                  - title
                  - content
                  - announcement_type
                  - is_pinned
                  - created_at
  "/api/v1/faqs":
    get:
      summary: FAQ 分类列表（含问答）
      tags:
      - 内容运营
      description: |
        获取所有启用的 FAQ 分类及其下属问题/答案，按分类排序。
        - **无需认证**，App 帮助中心直接调用
        - 支持 `?locale=` 指定语言（默认 `zh-CN`），内容多语言自动降级
        - 返回树形结构：分类 → 问题列表
      parameters:
      - name: locale
        in: query
        required: false
        description: 语言代码，如 zh-CN / en，默认 zh-CN
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: 订单相关
                    slug:
                      type: string
                      example: orders
                      description: 分类唯一标识符
                    faqs:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 10
                          question:
                            type: string
                            example: 如何取消订单？
                          answer:
                            type: string
                            example: 您可以在订单详情页点击「取消订单」按钮…
                        required:
                        - id
                        - question
                        - answer
                  required:
                  - id
                  - name
                  - slug
                  - faqs
  "/api/v1/coupons":
    get:
      summary: 我的优惠券列表
      tags:
      - 优惠券
      description: |
        获取当前登录用户的所有优惠券，按发放时间倒序。
        - 需要 Logto JWT 认证
        - 支持 `?status=` 按状态过滤：`unused` / `used` / `expired`
        - ⚠️ 响应格式为裸数组（非标准 `{success, data}` 封装），前端直接读取数组
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      - name: status
        in: query
        required: false
        enum:
        - unused
        - used
        - expired
        description: "按优惠券状态过滤:\n * `unused` \n * `used` \n * `expired` \n "
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    code:
                      type: string
                    status:
                      type: string
                      enum:
                      - unused
                      - used
                      - expired
                    grant_type:
                      type: string
                    granted_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
                      nullable: true
                    used_at:
                      type: string
                      format: date-time
                      nullable: true
                    usable:
                      type: boolean
                    template:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        coupon_type:
                          type: string
                        face_value:
                          type: string
                        min_order_amount:
                          type: string
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      message:
                        type: string
  "/api/v1/coupons/available":
    get:
      summary: 可用优惠券列表（下单时调用）
      tags:
      - 优惠券
      description: |
        获取当前用户可立即使用的优惠券（状态 `unused`，未过期）。
        - 可传 `?order_amount=` 按订单金额过滤（仅返回满足门槛的优惠券）
        - 需要 Logto JWT 认证
        - 用于创建订单时展示可用优惠券选择器
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      - name: order_amount
        in: query
        required: false
        description: 当前订单金额（如 "299.00"），用于过滤满足使用门槛的优惠券
        schema:
          type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    code:
                      type: string
                    status:
                      type: string
                      example: unused
                    usable:
                      type: boolean
                      example: true
                    template:
                      type: object
                      properties:
                        name:
                          type: string
                          example: 满100减20
                        face_value:
                          type: string
                          example: '20.0'
                        min_order_amount:
                          type: string
                          example: '100.0'
        '401':
          description: 未登录
  "/api/v1/coupons/redeem":
    post:
      summary: 兑换码核销
      tags:
      - 优惠券
      description: |
        用户输入兑换码（如活动码、礼品码）领取对应优惠券。
        - 需要 Logto JWT 认证
        - `code` 不区分大小写（服务端会转大写处理）
        - 兑换成功返回新领取的优惠券信息
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '201':
          description: 兑换成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  code:
                    type: string
                  status:
                    type: string
                    example: unused
                  grant_type:
                    type: string
                    example: redeem
                  granted_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  usable:
                    type: boolean
                    example: true
                  template:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      coupon_type:
                        type: string
                      face_value:
                        type: string
                      min_order_amount:
                        type: string
        '422':
          description: 兑换码无效或已使用
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 兑换码无效
        '401':
          description: 未登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 兑换码（不区分大小写）
                  example: SPRING2026
              required:
              - code
  "/api/v1/coupons/grant_new_user":
    post:
      summary: 新用户注册发券
      tags:
      - 优惠券
      description: |
        新用户完成注册后调用，自动发放所有配置了 `new_user` 规则的优惠券模板。
        - 需要 Logto JWT 认证
        - **建议在用户首次登录/注册成功后由客户端主动调用一次**
        - 若用户已领过新用户券，此接口返回空数组（幂等）
        - 发券失败（如已达到发放上限）会被忽略，不影响响应
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '201':
          description: 发券成功（可能为空数组，若无可用新用户券）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    code:
                      type: string
                    status:
                      type: string
                      example: unused
                    grant_type:
                      type: string
                      example: new_user
                    granted_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
                      nullable: true
                    usable:
                      type: boolean
                      example: true
                    template:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          example: 新用户专享 20 元券
                        face_value:
                          type: string
                          example: '20.0'
                        min_order_amount:
                          type: string
                          example: '100.0'
        '401':
          description: 未登录
  "/api/v1/feedbacks/captcha":
    get:
      summary: 获取验证码
      tags:
      - 用户反馈
      description: |
        获取验证码图片及 key，用于提交反馈前的人机验证。
        - **无需认证**
        - 返回 `captcha_key` 需在提交反馈时附带（`X-Captcha-Key` 请求头或 body 中）
        - ⚠️ 当前为占位实现（RuCaptcha 依赖 session，API-only 模式下降级），
          生产建议迁移至 Google reCAPTCHA 或 Cloudflare Turnstile
      responses:
        '200':
          description: 验证码获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  captcha_image:
                    type: string
                    nullable: true
                    description: Base64 编码的验证码图片（SVG/PNG），生产模式下有值，降级模式下为 null
                  captcha_key:
                    type: string
                    description: 32 位 hex 随机 key，提交反馈时需携带
                    example: a1b2c3d4e5f6...
                required:
                - captcha_key
  "/api/v1/feedbacks":
    post:
      summary: 提交用户反馈
      tags:
      - 用户反馈
      description: |
        提交匿名或实名的用户反馈，支持截图上传。
        - **无需认证**（匿名用户也可提交）
        - 若携带有效 JWT，反馈会自动关联当前用户
        - 提交成功后返回 `tracking_number`，可用于后续查询进度
        - Rate Limiting：同一 IP 每小时最多 3 次，同一邮箱每天最多 5 次
      parameters: []
      responses:
        '201':
          description: 反馈提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      tracking_number:
                        type: string
                        example: TRK-20260416-ABCD
                        description: 追踪号，可用于查询进度
                      message:
                        type: string
                        example: 您的反馈已提交，我们将尽快处理
                      estimated_response_time:
                        type: string
                        example: 预计 1-3 个工作日内回复
                    required:
                    - tracking_number
                    - message
        '400':
          description: 参数不足
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '422':
          description: 参数验证失败或验证码错误
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - validation_failed
                        - invalid_captcha
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type: object
                  properties:
                    feedback_type:
                      type: string
                      enum:
                      - bug
                      - suggestion
                      - complaint
                      - other
                      description: 反馈类型
                      example: bug
                    subject:
                      type: string
                      description: 反馈标题（简述）
                      example: 支付按钮无响应
                    content:
                      type: string
                      description: 详细内容
                      example: 在 iOS 16 上点击支付按钮后没有任何反应…
                    submitter_name:
                      type: string
                      description: 提交人姓名（可选）
                    submitter_email:
                      type: string
                      format: email
                      description: 提交人邮箱（用于回复通知，可选）
                      example: user@example.com
                    submitter_phone:
                      type: string
                      description: 提交人手机（可选）
                    page_url:
                      type: string
