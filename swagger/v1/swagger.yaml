          description: 未登录或 Token 无效
        '404':
          description: 工单不存在或不属于当前用户
        '422':
          description: 工单状态不允许关闭（已关闭）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalid_state
                      message:
                        type: string
  "/api/v1/users/device_tokens":
    post:
      summary: 注册设备推送 Token
