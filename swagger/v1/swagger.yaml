        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '201':
          description: 注册成功（含幂等重复注册）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      token:
                        type: string
                      platform:
                        type: string
                        enum:
                        - ios
                        - android
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: 未登录或 Token 无效
        '422':
          description: 参数无效（platform 不合法或 token 缺失）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_token:
                  type: object
                  properties:
                    token:
                      type: string
