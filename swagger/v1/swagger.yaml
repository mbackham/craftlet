      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: 设备 Token ID
        schema:
          type: integer
      responses:
        '204':
          description: 删除成功
        '401':
          description: 未登录或 Token 无效
        '404':
          description: Token 不存在
