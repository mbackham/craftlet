  "/api/v1/notifications/mark_read":
    patch:
      summary: 批量标记通知已读
      tags:
      - 通知
      description: |
        将指定通知标记为已读。
        - 传入 `ids` 数组：只标记指定 ID 的通知
        - 不传 `ids`（或传空数组）：标记当前用户所有未读通知为已读
        - 跨用户隔离：只处理属于当前用户的通知，其他用户的 ID 会被忽略
        需要 Logto JWT 认证。
      security:
      - Bearer: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer <Logto JWT>
        schema:
          type: string
      responses:
        '200':
          description: 全部标记已读（不传 ids）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      marked_count:
                        type: integer
                        description: 本次实际标记已读的数量
        '401':
          description: 未登录或 Token 无效
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: 要标记已读的通知 ID 列表（不传则标记全部未读）
